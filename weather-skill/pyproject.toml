[project]
name = "weather-skill"
version = "0.1.0"
description = "Fetch daily weather from open-meteo.com and format a compact report"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ISC001", "ISC002"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
