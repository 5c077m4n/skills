[project]
name = "news-anchor"
version = "0.1.0"
description = "Fetch headlines from the configured RSS sources"
requires-python = ">=3.12"
dependencies = ["feedparser>=6.0", "pydantic>=2.11"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ISC001", "ISC002"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
